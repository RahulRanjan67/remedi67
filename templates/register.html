{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:600px;margin-top:4rem;margin-bottom:4rem;">
    <div class="card">
        <h2 style="text-align:center;margin-bottom:2rem;">Register</h2>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Role</label>
                <div>
                    <label><input type="radio" name="role" value="buyer" checked> Buyer</label>
                    <label style="margin-left:1rem;"><input type="radio" name="role" value="seller"> Seller</label>
                    <label style="margin-left:1rem;"><input type="radio" name="role" value="ngo"> NGO</label>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">City</label>
                <select name="city" class="form-select" required>
                    <option value="">Select city</option>
                    {% for c in cities %}<option value="{{ c }}" {% if c == city %}selected{% endif %}>{{ c }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Pincode</label>
                <input type="text" name="pincode" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Locality</label>
                <input type="text" name="locality" class="form-control" required>
            </div>
            <div id="ngo-fields" style="display:none;background:var(--bg);padding:1rem;border-radius:8px;margin-bottom:1rem;">
                <p class="text-muted" style="font-size:0.875rem;margin-bottom:1rem;">NGO accounts require admin approval before login.</p>
                <div class="form-group">
                    <label class="form-label">NGO Name</label>
                    <input type="text" name="ngo_name" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Registration Number</label>
                    <input type="text" name="registration_number" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
        </form>
    </div>
</div>
{% endblock %}
