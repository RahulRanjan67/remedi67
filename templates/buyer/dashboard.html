{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:2rem;">
    <h2>Buyer Dashboard</h2>
    <p class="text-muted">Your requests across every city you've used ReMedi in.</p>
    <div class="dashboard-grid">
        <div class="card stat-card"><div class="num">{{ stats.active }}</div><div>Active Requests</div></div>
        <div class="card stat-card"><div class="num" style="color:var(--success)">{{ stats.approved }}</div><div>Approved</div></div>
        <div class="card stat-card"><div class="num" style="color:var(--info)">{{ stats.completed }}</div><div>Completed</div></div>
    </div>
    <div class="card">
        <h3>Quick Actions</h3>
        <a href="{{ url_for('common.search') }}" class="btn btn-primary">Search Medicines</a>
        <a href="{{ url_for('buyer.needs') }}" class="btn btn-secondary">Post Urgent Need</a>
    </div>
</div>
{% endblock %}
